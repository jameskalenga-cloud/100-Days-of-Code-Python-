<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Library</title>
  </head>
  <body>
    <h1>My Library</h1>

      {% if all_books == [] %}
        <p>Library is empty.</p>
      {% else %}
        <ul> 
          {% for book in all_books %}
          <li> 
            <span>
              <a href="/delete?id={{ book['id'] }}">
                <button>Delete</button>
              </a>
            </span>

            {{book['title']}}-{{book['author']}}-{{book['rating']}}   

            <span>
              <a href="/edit?id={{ book['id'] }}">
                <button>Edit</button>
              </a>
            </span>
          </li>
          {% endfor %}
        </ul>
      {% endif %}

    <a href="/add">Add New Book</a>
  </body>
</html>
